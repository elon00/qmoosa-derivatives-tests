name: Full-Spectrum Derivatives Reality Gates & Invariant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-derivatives-tests

      - name: Checkout protocol repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-derivatives-protocol
          ref: da83414
          path: qmoosa-derivatives-protocol

      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-derivatives-engine
          ref: 3be4705
          path: qmoosa-derivatives-engine

      - name: Checkout sdk repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-derivatives-sdk
          ref: 753f70a
          path: qmoosa-derivatives-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build protocol
        working-directory: qmoosa-derivatives-protocol
        run: npm install && npm run build

      - name: Build engine
        working-directory: qmoosa-derivatives-engine
        run: npm install && npm run build

      - name: Build sdk
        working-directory: qmoosa-derivatives-sdk
        run: npm install && npm run build

      - name: Install dependencies in tests
        working-directory: qmoosa-derivatives-tests
        run: npm install

      - name: Run Full 4-Gate Provenance Verification
        working-directory: qmoosa-derivatives-tests
        run: node scripts/verify-source-integrity.mjs

      - name: Run Real Cross-Repository Integration Suite
        working-directory: qmoosa-derivatives-tests
        run: npm run test:integration

      - name: Run Negative Control & Adversarial Defense Suite
        working-directory: qmoosa-derivatives-tests
        run: npm run test:negative

      - name: Run Static Syntax & Lint Verification
        working-directory: qmoosa-derivatives-tests
        run: npm run lint
