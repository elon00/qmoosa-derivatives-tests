name: Full-Spectrum Derivatives Reality Gates & Invariant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-derivatives-tests

      - name: Checkout protocol repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-derivatives-protocol
          ref: da834143dfe517f96646eebb0d7a6d21729511b9
          path: qmoosa-derivatives-protocol

      - name: Checkout engine repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-derivatives-engine
          ref: 40d2ba23fcd044c2ecef08638fe98c49b726c2f6
          path: qmoosa-derivatives-engine

      - name: Checkout sdk repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-derivatives-sdk
          ref: d9df614c1e4589243c35ad9cd84325f7c3cd9e6a
          path: qmoosa-derivatives-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: qmoosa-derivatives-tests/package-lock.json

      - name: Install dependencies in sibling repositories
        run: |
          npm ci --prefix qmoosa-derivatives-protocol
          npm ci --prefix qmoosa-derivatives-engine
          npm ci --prefix qmoosa-derivatives-sdk

      - name: Install dependencies in tests repository
        working-directory: qmoosa-derivatives-tests
        run: npm install

      - name: Run Source & Package Integrity Gate (Archive Mode)
        working-directory: qmoosa-derivatives-tests
        run: npm run verify:archive

      - name: Run Strict Current-HEAD Alignment Gate
        working-directory: qmoosa-derivatives-tests
        run: npm run verify:current-head

      - name: Run Source & Package Integrity Gate (Full Fail-Closed & Canonical Comparison)
        working-directory: qmoosa-derivatives-tests
        run: npm run test:integrity

      - name: Run Real Cross-Repository Integration Suite
        working-directory: qmoosa-derivatives-tests
        run: npm run test:integration

      - name: Run Negative Control & Adversarial Defense Suite
        working-directory: qmoosa-derivatives-tests
        run: npm run test:negative

      - name: Run Static Syntax & Lint Verification
        working-directory: qmoosa-derivatives-tests
        run: npm run lint
